  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #29B6E8; display: flex; align-items: center; gap: 56px;
    padding: 0 70px; font-family: Nunito, sans-serif;
  }
  body::before {
    content: ""; position: absolute; left: 34%; top: 46%;
    width: 2400px; height: 2400px; margin: -1200px 0 0 -1200px;
    background: repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(255,255,255,.13) 0deg 5deg, rgba(255,255,255,0) 5deg 17deg);
  }
  /* White halo. The logo disc is #29C2D5 against a #29B6E8 band, which is too
     close to separate on its own. drop-shadow follows the alpha, so the glow
     hugs the circle rather than boxing it. */
  .logo {
    width: 240px; height: 240px; flex: none; position: relative;
    filter: drop-shadow(0 0 14px rgba(255,255,255,.95))
            drop-shadow(0 0 34px rgba(255,255,255,.6))
            drop-shadow(0 0 70px rgba(255,255,255,.35));
  }
  .copy { position: relative; }
  /* font-weight 400 is load-bearing: h1 inherits bold from the UA stylesheet,
     Bangers ships only a 400 weight, and the browser then fakes a bold by
     smearing the glyphs. Values here mirror .display / .hero__title. */
  h1 {
    font-family: Bangers, sans-serif; font-weight: 400;
    font-size: 148px; line-height: .95;
    color: #fff; -webkit-text-stroke: .09em #1A1A1A; paint-order: stroke fill;
    text-shadow: 0 .06em 0 rgba(5,36,48,.28); letter-spacing: .02em;
  }
  p { font-size: 34px; font-weight: 800; color: #052430; margin-top: 20px;
       white-space: nowrap; }
</style>

  <div class="copy"><h1>REIDIFY</h1><p>Lots of games. Lots of ridiculous ideas.</p></div>
