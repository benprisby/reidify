<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en-us" }}">
<head>
  {{- partial "head.html" . }}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {{ partial "nav.html" . }}

  <main id="main">
    <section class="wrap notfound">
      <h1 class="display notfound__code">404</h1>
      <p class="hero__tagline">That page doesn't exist.</p>
      <p style="margin-top:1.5rem">
        <a href="{{ "/" | relURL }}">Back to the home page</a>, or
        <a href="{{ site.Params.youtube }}" target="_blank"
           rel="noopener">go watch something</a>.
      </p>
    </section>
  </main>

  {{ partial "footer.html" . }}
</body>
</html>
