{{- /* Off-site destinations only; the nav covers internal pages. The business
       email is intentionally absent — Contact owns it. */ -}}
<footer class="footer">
  <div class="wrap footer__inner">
    <p class="footer__copy">
      &copy; {{ now.Year }} Reidify
      <span class="footer__sep" aria-hidden="true">|</span>
      Site by <a href="https://benprisby.com" target="_blank"
                 rel="noopener">Ben Prisby</a>
    </p>
    <ul class="footer__links">
      <li>
        <a href="{{ site.Params.youtube }}" target="_blank"
           rel="noopener">YouTube</a>
      </li>
      <li>
        <a href="{{ site.Params.twitch }}" target="_blank"
           rel="noopener">Twitch</a>
      </li>
      <li>
        <a href="{{ site.Params.tiktok }}" target="_blank"
           rel="noopener">TikTok</a>
      </li>
      {{- with site.Params.shop }}
      <li>
        <a href="{{ . }}" target="_blank" rel="noopener">Merch</a>
      </li>
      {{- end }}
    </ul>
  </div>
</footer>
