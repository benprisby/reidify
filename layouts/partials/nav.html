{{- $logo := resources.Get "img/logo.png" -}}
<nav class="nav" aria-label="Primary">
  <div class="wrap nav__inner">
    <a class="nav__mark" href="{{ "/" | relURL }}">
      {{- with $logo }}
      <img class="nav__bolt" src="{{ .RelPermalink }}" alt="" width="32"
           height="32">
      {{- end }}
      <span class="display nav__wordmark">Reidify</span>
    </a>
    <ul class="nav__links">
      {{- range site.Menus.main }}
      <li>
        <a href="{{ .URL }}"
           {{ if $.IsMenuCurrent "main" . }}aria-current="page"{{ end }}>
          {{- .Name -}}
        </a>
      </li>
      {{- end }}
    </ul>
  </div>
</nav>
